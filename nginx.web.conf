server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # API + uploads → backend (docker-compose service name). On hosts without this proxy,
    # build the SPAs with an absolute VITE_API_URL instead and these blocks stay unused.
    #
    # The upstream host is resolved at REQUEST time (variable proxy_pass + Docker's embedded
    # DNS at 127.0.0.11) instead of at startup. With a literal `proxy_pass http://backend:...`,
    # nginx resolves `backend` once when it loads config and ABORTS with
    # "host not found in upstream" if it can't — crash-looping the container. Resolving lazily
    # lets nginx boot even when the backend is momentarily down or the name isn't up yet.
    # BACKEND_HOST/BACKEND_PORT can be overridden at container start via envsubst if needed.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $crm_backend http://backend:8080;
        proxy_pass $crm_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30M;
    }
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $crm_backend_up http://backend:8080;
        proxy_pass $crm_backend_up$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Immutable caching for hashed assets (both bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /crm/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # CRM app under /crm — its own SPA fallback. Must come BEFORE the website catch-all.
    location = /crm { return 301 /crm/; }
    location /crm/ {
        try_files $uri $uri/ /crm/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Public website — SPA fallback at the root.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    autoindex off;

    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
