services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    restart: unless-stopped
    command: >
      mysqld --default-authentication-plugin=mysql_native_password
             --character-set-server=utf8mb4
             --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arudra_crm}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    # Port 3306 is internal to Docker network for security (not exposed to host)
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  # -------------------------------------------------------------
  # Spring Boot Java 17 Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: 8080
      # Database connection
      DB_URL: ${SPRING_DATASOURCE_URL:-${DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-arudra_crm}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${DB_USERNAME:-${MYSQL_USER:-crm_user}}}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${DB_PASSWORD:-${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}}}
      # Security & JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://jbdecorcdm.com,https://www.jbdecorcdm.com}
      # Cloudflare R2 Object Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-${CLOUDFLARE_R2_ACCOUNT_ID:-}}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-${CLOUDFLARE_R2_BUCKET:-jbdecor}}
      R2_ENDPOINT: ${R2_ENDPOINT:-${CLOUDFLARE_R2_ENDPOINT:-}}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-${CLOUDFLARE_R2_ACCESS_KEY:-}}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-${CLOUDFLARE_R2_SECRET_KEY:-}}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-${CLOUDFLARE_R2_PUBLIC_DOMAIN:-}}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-network

  # -------------------------------------------------------------
  # React + Vite Frontend (Nginx SPA)
  # -------------------------------------------------------------
  # Option A: one container serves the public website at / and the CRM at /crm.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: jbdecor-web
    restart: unless-stopped
    # No host port: Caddy owns 80/443 on the host and reverse-proxies to this
    # container over the internal network. Exposed only to other services.
    expose:
      - "80"
    # Only wait for the backend container to START, not to pass its healthcheck. nginx proxies
    # /api lazily (resolver at request time), so web can serve the static SPAs immediately even
    # if the backend's health probe is briefly pessimistic. This keeps a health flap from
    # blocking the whole startup chain (and therefore Caddy / TLS).
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crm-network

  # -------------------------------------------------------------
  # Caddy — TLS termination + automatic HTTPS (Let's Encrypt)
  # -------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: jbdecor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists issued certificates — do NOT delete
      - caddy_config:/config
    # Start once web's container is up (not gated on its healthcheck). Caddy must come up so it
    # can obtain/serve the TLS certificate; if web is momentarily not ready it returns 502 rather
    # than the entire deploy failing on an unhealthy-dependency error.
    depends_on:
      web:
        condition: service_started
    networks:
      - crm-network

# ---------------------------------------------------------------
# Dedicated Bridge Network
# ---------------------------------------------------------------
networks:
  crm-network:
    name: crm-network
    driver: bridge

# ---------------------------------------------------------------
# Persistent Data Volumes (Never deleted on deploy)
# ---------------------------------------------------------------
volumes:
  mysql_data:
    name: crm_mysql_data
    driver: local
  caddy_data:
    name: crm_caddy_data
    driver: local
  caddy_config:
    name: crm_caddy_config
    driver: local
