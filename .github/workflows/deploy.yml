name: Build, Test & Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Build & Validation
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Build & Test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend (Spring Boot)
        run: |
          cd backend
          mvn clean test-compile -B

      # Frontend Build & Validate
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (React + Vite)
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Safe Deployment to Hostinger VPS via SSH
  # -------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Hostinger VPS
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "Starting CRM Production Deployment"
            echo "=========================================="

            # Target directory on VPS
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/crm' }}"

            # Ensure application directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating application directory at $APP_DIR..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Fetch and update latest code from main
            echo "Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Check if production .env exists
            if [ ! -f .env ]; then
              echo "NOTICE: .env file was not found in $APP_DIR."
              echo "Creating from .env.example template. Please update with real credentials!"
              cp .env.example .env
            fi

            # Build and deploy with Docker Compose (Preserving volumes!)
            echo "Building and starting Docker containers..."
            docker compose build
            docker compose up -d --remove-orphans

            # Check container status
            echo "Verifying running containers..."
            docker compose ps

            echo "=========================================="
            echo "Deployment Completed Successfully!"
            echo "=========================================="
