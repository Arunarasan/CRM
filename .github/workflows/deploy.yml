name: Build, Test & Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Build & Validation
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Build & Test (Java 17 Spring Boot)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend
        run: |
          cd backend
          mvn clean test-compile -B

      # Frontend Build & Validate (Node 20 React + Vite)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Safe Deployment to Hostinger VPS via SSH (No sudo)
  # -------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Hostinger VPS
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "======================================================="
            echo "Starting Production Deployment on Hostinger VPS"
            echo "======================================================="

            # STEP 1: Checking APP_DIR
            echo "--> STEP 1: Checking APP_DIR"
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/crm' }}"
            echo "Target Directory: $APP_DIR"
            echo "Current Working Directory:"
            pwd
            echo "Current User:"
            whoami
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR does not exist. Creating..."
              mkdir -p "$APP_DIR"
            fi
            echo "Directory details:"
            ls -ld "$APP_DIR"
            cd "$APP_DIR"
            echo "Successfully navigated to $APP_DIR"

            # STEP 2: Checking Git repository
            echo "--> STEP 2: Checking Git repository"
            git config --global --add safe.directory "$APP_DIR" || true
            if [ ! -d ".git" ]; then
              echo "Git repository not initialized in $APP_DIR. Initializing..."
              git init -b main
            else
              echo "Git repository already exists in $APP_DIR."
              echo "Git Status:"
              git status --short || true
              echo "Current Branch:"
              git branch --show-current || true
            fi

            # STEP 3: Checking Git remote
            echo "--> STEP 3: Checking Git remote"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            echo "Configuring remote origin: $REPO_URL"
            if git remote get-url origin > /dev/null 2>&1; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi
            echo "Configured Remotes:"
            git remote -v

            # STEP 4: Fetching main
            echo "--> STEP 4: Fetching main"
            git fetch origin main
            echo "Successfully fetched origin/main"

            # STEP 5: Resetting to origin/main
            echo "--> STEP 5: Resetting to origin/main"
            git reset --hard origin/main
            echo "Successfully reset working tree to origin/main"
            echo "Current Commit on VPS:"
            git log -1 --oneline

            # STEP 6: Checking production .env
            echo "--> STEP 6: Checking production .env"
            if [ -f .env ]; then
              echo "Production .env EXISTS: Confirmed ($APP_DIR/.env is present)"
            else
              echo "======================================================="
              echo "ERROR: Production .env file is MISSING in $APP_DIR!"
              echo "Please create $APP_DIR/.env on the VPS with real production credentials."
              echo "======================================================="
              exit 1
            fi

            # STEP 7: Checking Docker
            echo "--> STEP 7: Checking Docker"
            echo "Docker Version:"
            docker --version
            echo "Docker Compose Version:"
            docker compose version
            echo "Validating Docker Compose Configuration..."
            docker compose config --quiet
            echo "Docker Compose Configuration is valid"

            # STEP 8: Building Docker images
            echo "--> STEP 8: Building Docker images"
            docker compose build
            echo "Docker images built successfully"

            # STEP 9: Starting containers
            echo "--> STEP 9: Starting containers"
            docker compose up -d --remove-orphans
            echo "Containers started successfully"

            # STEP 10: Verifying containers
            echo "--> STEP 10: Verifying containers"
            echo "Container Status:"
            docker compose ps

            echo "======================================================="
            echo "Recent Backend Logs:"
            docker compose logs --tail=100 backend

            echo "======================================================="
            echo "Recent Frontend Logs:"
            docker compose logs --tail=100 frontend

            echo "======================================================="
            echo "Recent MySQL Logs:"
            docker compose logs --tail=50 mysql

            echo "======================================================="
            echo "Deployment Completed Successfully!"
            echo "======================================================="
