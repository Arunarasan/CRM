name: Build, Test & Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Build & Validation
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Build & Test (Java 17 Spring Boot)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend
        run: |
          cd backend
          mvn clean test-compile -B

      # Frontend Build & Validate (Node 20 React + Vite)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Safe Deployment to Hostinger VPS via SSH
  # -------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Hostinger VPS
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "======================================================="
            echo "Starting Production Deployment on Hostinger VPS"
            echo "======================================================="

            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/crm' }}"

            # Ensure application directory and git repository exist
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not initialized at $APP_DIR. Cloning repository..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Pull latest changes from main branch without overwriting .env
            echo "Fetching latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Strict Safety Check: Verify production .env exists on VPS
            if [ ! -f .env ]; then
              echo "======================================================="
              echo "ERROR: Production .env file was not found in $APP_DIR!"
              echo "Deployment halted to prevent running with unconfigured secrets."
              echo "Please create $APP_DIR/.env with real production credentials."
              echo "======================================================="
              exit 1
            fi

            # Build and deploy containers (ZERO volume destruction)
            echo "Building Docker images..."
            docker compose build

            echo "Starting production containers..."
            docker compose up -d --remove-orphans

            # Verify container status and inspect logs
            echo "======================================================="
            echo "Container Status:"
            docker compose ps

            echo "======================================================="
            echo "Recent Backend Logs:"
            docker compose logs --tail=100 backend

            echo "======================================================="
            echo "Recent Frontend Logs:"
            docker compose logs --tail=100 frontend

            echo "======================================================="
            echo "Recent MySQL Logs:"
            docker compose logs --tail=50 mysql

            echo "======================================================="
            echo "Deployment Completed Successfully!"
            echo "======================================================="
