name: Build, Test & Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Automated Build & Validation
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Build & Test (Java 17 Spring Boot)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend
        run: |
          cd backend
          mvn clean test-compile -B

      # Frontend Build & Validate (Node 20 React + Vite)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Safe Deployment to Hostinger VPS via SSH (No sudo)
  # -------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Hostinger VPS
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # One deploy on the VPS at a time: overlapping runs would race on git reset + docker compose.
    # Never cancel a deploy mid-way; a newer push waits for the current one to finish.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # No `script_stop`: it appends an exit-code check after EVERY line, which breaks
          # backslash-continued commands (it glued itself onto the Caddy `docker run`).
          # The script's own `set -e` already stops on the first failure.
          # A cold Maven download on the VPS can take well over the 10-minute default.
          command_timeout: 30m
          script: |
            set -e
            echo "======================================================="
            echo "Starting Production Deployment on Hostinger VPS"
            echo "======================================================="

            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/crm' }}"
            echo "Target Application Directory: $APP_DIR"

            # 1. Ensure application directory exists and navigate into it
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating directory $APP_DIR..."
              mkdir -p "$APP_DIR"
            fi

            # 2. Git Synchronization
            if [ -d "$APP_DIR/.git" ]; then
              echo "Git repository exists in $APP_DIR."
              cd "$APP_DIR"

              echo "--> Checking git status..."
              git status --short || true

              echo "--> Checking git remotes..."
              git remote -v

              echo "--> Fetching origin/main..."
              git fetch origin main

              echo "--> Checking out main branch..."
              git checkout main || git checkout -B main origin/main

              echo "--> Resetting to origin/main..."
              git reset --hard origin/main

              echo "--> Current commit on VPS:"
              git log -1 --oneline
            else
              echo "Git repository does not exist in $APP_DIR. Cloning repository..."
              git clone --branch main https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # 3. Verify critical project files exist
            echo "--> Verifying docker-compose.yml exists..."
            test -f docker-compose.yml || { echo "ERROR: docker-compose.yml is missing in $APP_DIR!"; exit 1; }
            echo "docker-compose.yml verified."

            # 4. Strict Safety Check: Verify production .env exists on VPS
            echo "--> Verifying production .env exists..."
            if [ -f .env ]; then
              echo "Production .env EXISTS: Confirmed ($APP_DIR/.env is present)"
            else
              echo "======================================================="
              echo "ERROR: Production .env file is MISSING in $APP_DIR!"
              echo "Deployment halted to prevent running with unconfigured secrets."
              echo "Please create $APP_DIR/.env on the VPS with real production credentials."
              echo "======================================================="
              exit 1
            fi

            # 4b. Pre-flight: verify required secrets are present (clear, named error
            #     instead of the terse "VAR is required" that `docker compose config` throws).
            echo "--> Pre-flight: checking required variables in .env..."
            REQUIRED_VARS="MYSQL_PASSWORD MYSQL_ROOT_PASSWORD JWT_SECRET"
            MISSING=""
            for VAR in $REQUIRED_VARS; do
              # Require KEY= followed by at least one non-whitespace character.
              if ! grep -Eq "^[[:space:]]*${VAR}=[[:space:]]*[^[:space:]]" .env; then
                MISSING="$MISSING $VAR"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "======================================================="
              echo "ERROR: Required variable(s) missing or empty in $APP_DIR/.env:"
              for VAR in $MISSING; do echo "  - $VAR"; done
              echo "Add them to $APP_DIR/.env (see .env.example at the repo root), then re-run the deploy."
              echo "Deployment halted before touching the running containers."
              echo "======================================================="
              exit 1
            fi
            echo "Required variables present."

            # 5. Validate Docker Compose Configuration
            echo "--> Validating Docker Compose Configuration..."
            docker compose config --quiet
            echo "Docker Compose Configuration is valid."

            # 6. Build and deploy containers (ZERO volume destruction)
            echo "--> Building Docker images..."
            docker compose build

            echo "--> Starting production containers..."
            docker compose up -d --remove-orphans

            # 6b. Apply Caddyfile changes. `up -d` doesn't restart Caddy when only its config file
            #     changed, and the Caddyfile is a single-file bind mount: git replaces the file, so the
            #     running container keeps seeing the OLD copy. Validate the new file first; if the
            #     container's copy differs, recreate Caddy (re-binds the file); otherwise reload
            #     gracefully. A bad Caddyfile never takes the site down — the running Caddy is kept.
            echo "--> Applying Caddy configuration..."
            if docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
                 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
              if docker compose exec -T caddy cat /etc/caddy/Caddyfile 2>/dev/null | cmp -s - Caddyfile; then
                docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
                  && echo "Caddy reloaded." || echo "WARNING: Caddy reload failed; running config kept."
              else
                echo "Caddyfile changed — recreating Caddy..."
                docker compose up -d --force-recreate --no-deps caddy
              fi
            else
              echo "WARNING: Caddyfile failed validation — keeping the running Caddy config."
            fi

            # 7. Verify container status
            echo "======================================================="
            echo "Container Status:"
            docker compose ps

            # 8. Display recent logs after starting
            echo "======================================================="
            echo "Recent Backend Logs:"
            docker compose logs --tail=100 backend

            echo "======================================================="
            echo "Recent Web (website + CRM) Logs:"
            docker compose logs --tail=100 web

            echo "======================================================="
            echo "Recent MySQL Logs:"
            docker compose logs --tail=50 mysql

            echo "======================================================="
            echo "Deployment Completed Successfully!"
            echo "======================================================="
