services:
  # -------------------------------------------------------------
  # Frontend: React + Vite Static Site (Free on Render)
  # -------------------------------------------------------------
  - type: web
    name: crm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: crm-backend
          property: host

  # -------------------------------------------------------------
  # Backend: Spring Boot Java 17 API (Docker Web Service)
  # -------------------------------------------------------------
  - type: web
    name: crm-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://crm-frontend.onrender.com,http://localhost:5173
      - key: STORAGE_TYPE
        value: s3
      - key: R2_BUCKET_NAME
        value: jbdecor
      - key: R2_ENDPOINT
        value: https://6ded68d1395464810b575e43d47d5346.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
