spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}
  storage:
    type: ${STORAGE_TYPE:${STORAGE_PROVIDER:s3}}
    s3:
      bucket: ${R2_BUCKET_NAME:${S3_BUCKET:jbdecor}}
      region: ${R2_REGION:${S3_REGION:auto}}
      endpoint: ${R2_ENDPOINT:${S3_ENDPOINT:https://6ded68d1395464810b575e43d47d5346.r2.cloudflarestorage.com}}
      access-key: ${R2_ACCESS_KEY_ID:${R2_ACCESS_KEY:${S3_ACCESS_KEY:}}}
      secret-key: ${R2_SECRET_ACCESS_KEY:${R2_SECRET:${S3_SECRET_KEY:}}}
      public-base-url: ${R2_PUBLIC_DOMAIN:${S3_PUBLIC_BASE_URL:}}
      path-style-access: true
