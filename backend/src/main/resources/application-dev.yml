spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}
  storage:
    type: ${STORAGE_TYPE:${STORAGE_PROVIDER:s3}}
    s3:
      bucket: ${S3_BUCKET:${R2_BUCKET_NAME:jbdecor}}
      region: ${S3_REGION:${R2_REGION:auto}}
      endpoint: ${S3_ENDPOINT:${R2_ENDPOINT:https://6ded68d1395464810b575e43d47d5346.r2.cloudflarestorage.com}}
      access-key: ${S3_ACCESS_KEY:${R2_ACCESS_KEY_ID:<NEW_ACCESS_KEY>}}
      secret-key: ${S3_SECRET_KEY:${R2_SECRET_ACCESS_KEY:<NEW_SECRET_KEY>}}
      public-base-url: ${S3_PUBLIC_BASE_URL:${R2_PUBLIC_DOMAIN:}}
      path-style-access: true
