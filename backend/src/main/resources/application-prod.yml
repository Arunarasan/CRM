# No fallbacks in prod: the app must refuse to start rather than run with a dev default secret/password.
jwt:
  secret: ${JWT_SECRET}

spring:
  datasource:
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://crm.arudra.com,https://app.arudra.com}
