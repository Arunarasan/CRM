spring:
  application:
    name: arudra-crm
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/arudra_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema as managed by Hibernate ddl-auto before Flyway was introduced"
  # SMTP for password-reset OTP emails. Leave MAIL_USERNAME blank to keep dev in console-log
  # mode (EmailService prints the OTP instead of sending). For Gmail use an App Password.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: ${PORT:10000}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
  health:
    # The mail indicator opens an SMTP connection on every /actuator/health poll. Without SMTP
    # credentials (or during a transient mail outage) it reports DOWN, which flips the whole
    # endpoint to HTTP 503 and fails the container healthcheck (`curl -f`), aborting the deploy.
    # Mail is non-critical to serving the app, so exclude it from the health probe.
    mail:
      enabled: false


jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:900000}

app:
  name: ${APP_NAME:Arudra CRM}
  # Canonical public website origin (no trailing slash). Used to build absolute URLs in the
  # dynamically generated sitemap so Google sees one consistent host.
  public-site-url: ${PUBLIC_SITE_URL:https://jbdecorcdm.com}
  # WebAuthn (device biometric) for attendance clock-in. rp-id MUST be the registrable domain the
  # CRM is served from (e.g. "crm.arudra.com"; "localhost" in dev) — NOT a URL. origin is the exact
  # scheme+host+port the portal is loaded from and MUST match at register + assert time.
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:${APP_NAME:Arudra CRM}}
    origin: ${WEBAUTHN_ORIGIN:http://localhost:5173}
  # Biometric attendance terminals (HR → Attendance → Devices).
  attendance:
    device:
      # Signing key for short-lived terminal tokens; defaults to (a domain-separated derivative of) jwt.secret.
      token-secret: ${ATTENDANCE_DEVICE_TOKEN_SECRET:${jwt.secret}}
      token-ttl-seconds: ${ATTENDANCE_DEVICE_TOKEN_TTL:900}
      heartbeat-interval-seconds: ${ATTENDANCE_DEVICE_HEARTBEAT_SECONDS:60}
      # A terminal with no heartbeat for this long is shown OFFLINE and admins are alerted once.
      offline-after-seconds: ${ATTENDANCE_DEVICE_OFFLINE_AFTER:300}
      # A second scan within this many minutes of check-in answers "Already checked in" (no check-out).
      min-checkout-gap-minutes: ${ATTENDANCE_MIN_CHECKOUT_GAP:15}
      # Offline punches older than this are rejected on sync.
      max-offline-hours: ${ATTENDANCE_MAX_OFFLINE_HOURS:72}
      success-screen-seconds: 4
      # Reject punches for employees assigned to a different branch than the terminal.
      enforce-branch: ${ATTENDANCE_ENFORCE_BRANCH:true}
      code-prefix: ${ATTENDANCE_DEVICE_CODE_PREFIX:ARUDRA-ATT}
      pairing-ttl-hours: 24
      enrollment-ttl-minutes: 10
  mail:
    # From address on OTP emails. Defaults to the SMTP username when blank.
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@arudra.com}}
  otp:
    # Password-reset OTP length and validity window (minutes).
    length: ${OTP_LENGTH:6}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  storage:
    # "local" = write to app.upload.dir (dev default). "s3" or "r2" = AWS S3 or Cloudflare R2.
    type: ${STORAGE_TYPE:${STORAGE_PROVIDER:local}}
    s3:
      bucket: ${R2_BUCKET_NAME:${S3_BUCKET:${CLOUDFLARE_R2_BUCKET:}}}
      # AWS: a real region (e.g. ap-south-1). Cloudflare R2: leave as "auto".
      region: ${R2_REGION:${S3_REGION:auto}}
      # AWS: leave blank. R2: https://<account-id>.r2.cloudflarestorage.com
      endpoint: ${R2_ENDPOINT:${S3_ENDPOINT:${CLOUDFLARE_R2_ENDPOINT:}}}
      access-key: ${R2_ACCESS_KEY_ID:${R2_ACCESS_KEY:${S3_ACCESS_KEY:${CLOUDFLARE_R2_ACCESS_KEY:}}}}
      secret-key: ${R2_SECRET_ACCESS_KEY:${R2_SECRET:${S3_SECRET_KEY:${CLOUDFLARE_R2_SECRET_KEY:}}}}
      # Public origin objects are served from (public bucket / R2 pub-*.r2.dev / CDN domain). No trailing slash.
      public-base-url: ${R2_PUBLIC_DOMAIN:${S3_PUBLIC_BASE_URL:${CLOUDFLARE_R2_PUBLIC_DOMAIN:}}}
      # R2 needs path-style; classic AWS S3 can set this false for virtual-hosted URLs.
      path-style-access: ${S3_PATH_STYLE:true}

